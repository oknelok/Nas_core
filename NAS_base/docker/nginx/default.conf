server {
    listen 80;
    server_name _;

    root /var/www/html/web;
    index index.php;

    # Drupal clean URLs
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120;
    }

    # Deny access to sensitive files
    location ~ (^|/)\. {
        deny all;
    }
    location ~* /sites/.*/private/ {
        deny all;
    }

    # Drupal 11 lazy CSS/JS aggregation — files are generated by PHP on first request.
    # Pass to PHP if the aggregated file does not exist yet.
    location ~* /sites/default/files/(css|js)/ {
        try_files $uri /index.php?$query_string;
    }

    # Static file caching for all other assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
