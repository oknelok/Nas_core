services:
  # ── PHP 8.4-FPM + Drupal 11 ────────────────────────────────────────────────
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: nas_php
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${DRUPAL_ROOT:-./drupal}:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - nas_net

  # ── Nginx ──────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nas_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ${DRUPAL_ROOT:-./drupal}:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - nas_net

  # ── MariaDB 11 ─────────────────────────────────────────────────────────────
  mariadb:
    image: mariadb:11
    container_name: nas_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nas_net

volumes:
  mariadb_data:

networks:
  nas_net:
    driver: bridge
