services:

  # ── Database (required by NAS_base) ────────────────────────────────────────
  db:
    image: mariadb:11
    profiles: [backend]
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DRUPAL_DB_NAME:-drupal}
      MARIADB_USER: ${DRUPAL_DB_USER:-drupal}
      MARIADB_PASSWORD: ${DRUPAL_DB_PASS}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - nas_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Drupal backend ──────────────────────────────────────────────────────────
  nas_base:
    build:
      context: ./NAS_base
    profiles: [backend]
    environment:
      DRUPAL_DB_HOST: ${DRUPAL_DB_HOST:-db}
      DRUPAL_DB_NAME: ${DRUPAL_DB_NAME:-drupal}
      DRUPAL_DB_USER: ${DRUPAL_DB_USER:-drupal}
      DRUPAL_DB_PASS: ${DRUPAL_DB_PASS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nas_network
    volumes:
      - drupal_files:/var/www/html/web/sites/default/files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Next.js frontend ────────────────────────────────────────────────────────
  nas_frontend:
    build:
      context: ./NAS_frontend
    profiles: [frontend]
    ports:
      - "3000:3000"
    environment:
      DRUPAL_BASE_URL: ${DRUPAL_BASE_URL:-http://nas_base}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    depends_on:
      nas_base:
        condition: service_healthy
        required: false
    networks:
      - nas_network

networks:
  nas_network:
    driver: bridge

volumes:
  db_data:
  drupal_files:
